description: CircleCI is a continuous integration and continuous delivery (CI/CD) platform that automates
  software build, test, and deployment pipelines. Their developer surface includes the REST API v2 (the
  recommended modern interface), the legacy v1 REST API, a Self-Hosted Runner API, webhooks for real-time
  event notifications, and the Orbs Registry of reusable configuration packages. Authentication is via
  a personal or project Circle-Token sent in the Circle-Token header; responses are JSON.
