description: >-
  CircleCI is a continuous integration and continuous delivery (CI/CD) platform that automates software build, test, and
  deployment pipelines. Their developer surface includes the REST API v2 (the recommended modern interface), the legacy
  v1 REST API, a Self-Hosted Runner API, webhooks for real-time event notifications, and the Orbs Registry of reusable
  configuration packages. Authentication is via a personal or project Circle-Token sent in the Circle-Token header;
  responses are JSON.
apis:
- aid: circleci:runner-api
  name: CircleCI Self-Hosted Runner API
  tags:
  - CI/CD
  - Infrastructure
  - Runners
  - Self-Hosted
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://runner.circleci.com
  humanURL: https://circleci.com/docs/runner-api/
  properties:
  - url: https://circleci.com/docs/runner-api/
    type: Documentation
  - url: openapi/circleci-runner-api-openapi.yml
    type: OpenAPI
  description: >-
    The CircleCI Self-Hosted Runner API enables management and execution of jobs on self-hosted runner
    infrastructure. It provides endpoints for listing available runners, managing runner tasks, and querying
    resource classes. The API is hosted separately from the main CircleCI API at runner.circleci.com and
    supports multiple authentication methods depending on the endpoint. Developers can use this API to
    integrate self-hosted runner management into their infrastructure automation workflows.
- aid: circleci:webhooks
  name: CircleCI Webhooks
  tags:
  - CI/CD
  - Events
  - Notifications
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://circleci.com/docs/webhooks/
  properties:
  - url: https://circleci.com/docs/webhooks/
    type: Documentation
  - url: asyncapi/circleci-webhooks-asyncapi.yml
    type: AsyncAPI
  description: >-
    CircleCI Webhooks allow developers to receive real-time notifications about events in their CI/CD
    pipelines by configuring HTTP callbacks. Webhooks can be set up through project settings to notify
    external services when workflows and jobs complete, fail, or change status. This enables integration
    with monitoring systems, chat platforms, and custom automation workflows. Webhooks deliver JSON payloads
    containing event details to configured endpoint URLs.
- aid: circleci:orbs
  name: CircleCI Orbs Registry
  tags:
  - CI/CD
  - Configuration
  - Packages
  - Reusable
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://circleci.com/developer/orbs
  properties:
  - url: https://circleci.com/developer/orbs
    type: Documentation
  description: >-
    CircleCI Orbs are shareable, reusable packages of CircleCI configuration that simplify build setup
    and integration with third-party tools. The Orbs Registry on the CircleCI Developer Hub provides a
    searchable catalog of community and certified orbs. Developers can browse, publish, and consume orbs
    to automate repeated processes, speed up project configuration, and integrate services like AWS, Docker,
    Slack, and Kubernetes into their CI/CD pipelines.
