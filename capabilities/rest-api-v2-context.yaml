    namespace: rest-api-v2-context
    baseUri: https://circleci.com/api/v2
    description: CircleCI REST API v2 — Context business capability. Self-contained, no shared references.
    resources:
    - name: context
      path: /context
      operations:
      - name: listcontexts
        method: GET
        description: List contexts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcontext
        method: POST
        description: Create a context
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: context-context-id
      path: /context/{context-id}
      operations:
      - name: getcontext
        method: GET
        description: Get a context
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletecontext
        method: DELETE
        description: Delete a context
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: context-context-id-environment-variable
      path: /context/{context-id}/environment-variable
