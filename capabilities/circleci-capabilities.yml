# Naftiko capabilities profile for CircleCI.
# Capabilities map verbs against the high-value operations exposed by the
# CircleCI REST API v2, Runner API, and Webhooks. Each capability links
# back to the canonical OpenAPI / AsyncAPI definitions in this repo.
provider: circleci
name: CircleCI
description: >-
  CircleCI is a CI/CD platform. These capabilities cover triggering pipelines,
  inspecting workflows and jobs, managing contexts and webhooks, and listing
  self-hosted runners.
capabilities:
  - id: circleci.pipelines.trigger
    name: Trigger pipeline
    description: Kick off a new pipeline for a project on a specified branch or tag.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1project~1{project-slug}~1pipeline/post
    inputs:
      - project-slug
      - branch
      - tag
      - parameters
    outputs:
      - pipeline-id
      - number
      - state

  - id: circleci.pipelines.list
    name: List pipelines
    description: Return all pipelines for a project, with optional branch filter.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1project~1{project-slug}~1pipeline/get
    inputs:
      - project-slug
      - branch
      - page-token
    outputs:
      - items
      - next_page_token

  - id: circleci.workflows.get
    name: Get workflow
    description: Retrieve a single workflow by ID.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1workflow~1{id}/get
    inputs:
      - workflow-id
    outputs:
      - id
      - name
      - status

  - id: circleci.workflows.cancel
    name: Cancel workflow
    description: Cancel a running workflow.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1workflow~1{id}~1cancel/post
    inputs:
      - workflow-id
    outputs:
      - message

  - id: circleci.workflows.rerun
    name: Rerun workflow
    description: Rerun a workflow from start or from failed jobs.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1workflow~1{id}~1rerun/post
    inputs:
      - workflow-id
      - from_failed
    outputs:
      - workflow_id

  - id: circleci.jobs.get
    name: Get job
    description: Retrieve job details by project slug and job number.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1project~1{project-slug}~1job~1{job-number}/get
    inputs:
      - project-slug
      - job-number
    outputs:
      - status
      - duration
      - executor

  - id: circleci.artifacts.list
    name: List job artifacts
    description: Return URLs for artifacts produced by a job.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1project~1{project-slug}~1{job-number}~1artifacts/get
    inputs:
      - project-slug
      - job-number
    outputs:
      - items

  - id: circleci.contexts.list
    name: List contexts
    description: List shared contexts for an owner.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1context/get
    inputs:
      - owner-id
    outputs:
      - items

  - id: circleci.webhooks.subscribe
    name: Create webhook subscription
    description: Subscribe an external URL to project events.
    api: circleci:rest-api-v2
    operationRef: openapi/circleci-rest-api-v2-openapi.yml#/paths/~1webhook/post
    inputs:
      - name
      - events
      - url
      - scope
      - signing-secret
    outputs:
      - id

  - id: circleci.runner.list-claims
    name: List runner resource claims
    description: List active claims on a self-hosted runner resource class.
    api: circleci:runner-api
    operationRef: openapi/circleci-runner-api-openapi.yml#/paths/~1api~1v2~1runner/get
    inputs:
      - resource-class
    outputs:
      - items

  - id: circleci.events.workflow-completed
    name: Workflow completed event
    description: Webhook event fired when a workflow finishes (success or failure).
    api: circleci:webhooks
    operationRef: asyncapi/circleci-webhooks-asyncapi.yml#/channels/workflow-completed
    payload-schema: json-schema/circleci-webhook-event-schema.json
