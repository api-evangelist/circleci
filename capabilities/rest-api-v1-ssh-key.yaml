        idempotent: true
      call: rest-api-v1-ssh-key.getcheckoutkey
      with:
        fingerprint: tools.fingerprint
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-checkout-key
      description: Delete a checkout key
      hints:
        readOnly: false
