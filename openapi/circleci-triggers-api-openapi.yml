components:
  responses:
    InternalError:
      description: Internal server error. Safe to retry with backoff; quote error.id when reporting it.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limited. Wait the Retry-After header's seconds, then retry with backoff.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing, invalid or expired token. Do not retry without a new token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found - the resource does not exist, or the caller is not entitled to know that it does.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - authenticated but not permitted to perform this action. Do not retry.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    Error:
      properties:
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        id:
          description: Unique identifier for this occurrence. Include it when reporting the problem so support can find the failure.
          type: string
        source:
          description: Identifies the origin of the error in the request.
          properties:
            error:
              description: Underlying parser/validation error message.
              type: string
            offset:
              description: Byte offset in the JSON input where the error was detected.
              format: int64
              type: integer
            pointer:
              description: JSON Pointer (RFC 6901) to the field that caused the error.
              type: string
          type: object
        title:
          description: Short, human-readable summary of the problem.
          type: string
        type:
          description: 'Low-cardinality machine-readable error type, present only where an operation sets one explicitly - absent is normal, so branch on the HTTP status first and use this to tell causes apart within one status. A bare token, never a URI to dereference. The value set is open, so treat an unrecognised value as a generic failure for the status. Request-parsing errors use: syntax_error, empty_input, unknown_field, invalid_structure, invalid_format, type_mismatch, validation_error, invalid_route, invalid_path_param.'
          type: string
      type: object
  securitySchemes:
    bearer_token:
      scheme: bearer
      type: http
