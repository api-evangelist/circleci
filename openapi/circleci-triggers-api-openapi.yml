                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                              webhook:
                                type:
                                - object
                                - 'null'
                                properties:
                                  name:
                                    type:
                                    - string
                                    - 'null'
                                  secret:
                                    type:
                                    - string
                                    - 'null'
                                  source:
                                    type:
                                    - string
                                    - 'null'
                            required:
                            - type
                          is_disabled:
                            type: boolean
                          parameters:
                            type:
                            - object
                            - 'null'
                            additionalProperties: {}
                        required:
                        - event
                        - is_disabled
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          pipeline:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - pipeline
                        - project
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
