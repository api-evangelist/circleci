                            format: date-time
                          home_url:
                            type:
                            - string
                            - 'null'
                          is_listed:
                            type: boolean
                          is_private:
                            type: boolean
                          last_30_days_build_count:
                            type: integer
                          last_30_days_org_count:
                            type: integer
                          last_30_days_project_count:
                            type: integer
                          name:
                            type: string
                        required:
                        - is_listed
                        - is_private
                        - last_30_days_build_count
                        - last_30_days_org_count
                        - last_30_days_project_count
                        - name
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          namespace:
                            type: object
                            properties:
                              attributes:
                                type: object
                                properties:
                                  name:
                                    type: string
                                required:
                                - name
                              id:
                                type: string
                                format: uuid
                            required:
                            - attributes
                            - id
                          orb_categories:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                attributes:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                  required:
                                  - name
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - attributes
                              - id
                          orb_versions:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                attributes:
                                  type: object
                                  properties:
                                    created_at:
                                      type:
                                      - string
                                      - 'null'
                                      format: date-time
                                    version:
                                      type: string
                                  required:
                                  - version
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - attributes
                              - id
                        required:
                        - namespace
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/orb/packages/validate:
    post:
      operationId: post-orb-packages-validate
      tags:
      - Orb Packages
      summary: Checks whether the given orb YAML is valid
      description: The data entity does not include an id because validate is not scoped to an existing entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                yaml:
                  type: string
              required:
              - yaml
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          errors:
                            type:
                            - array
                            - 'null'
                            items:
                              type: string
                          is_valid:
                            type: boolean
                          output_yaml:
                            type:
                            - string
                            - 'null'
                        required:
                        - is_valid
                    required:
                    - attributes
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
