openapi: 3.2.0
info:
  title: CircleCI API V3 Orb Packages API
  version: '3.0'
  description: 'CircleCI''s V3 API. Every route is served under `/api/v3` on `https://circleci.com`.


    No standard is implemented. V3 takes the ideas that work from established API designs and

    combines them into one coherent whole, but it is not JSON:API, not `problem+json`, and not HAL.

    Familiar names like `data`, `attributes`, `source.pointer` and `filter[...]` carry no behaviour

    from those specs. Take everything from this document, and do not use a standard-conformant client

    library.


    ## Conventions


    ### Auth


    `Authorization: Bearer `. A token in a query parameter is rejected.


    ### Ids


    Ids are UUIDs, never slugs or names. Some collections resolve a slug via `filter[slug]`.


    ### One resource


    `{"data": {"id", "attributes", "references"}}`. Each entry in `references` is an `id`, or an array

    of them, sometimes carrying a nested `attributes` object of denormalised fields from the referenced

    resource. Read the operation''s schema for which fields those are, and fetch the resource itself for

    anything not listed - there is no way to request more inline.


    ### A collection


    `{"data": [...], "page": {"next", "prev"}}`. `page.next` and `page.prev` are opaque cursor values,

    not URLs - send one back as `page[cursor]`, unmodified, and stop when `page.next` is `null`.

    `page[limit]` bounds are per-operation, and out of range is a 400, not a clamp.


    ### Scoping


    Scoping uses `filter[...]`. Most list operations require a scope filter such as `filter[org_id]` or

    `filter[project_id]` and return 400 without it, so read the operation''s parameters.


    ### Methods


    `GET` reads, `POST` creates and performs named actions and partial updates, `PUT` replaces in full,

    `DELETE` removes. There is no `PATCH`.


    ### Retrying


    `GET`, `PUT` and `DELETE` are idempotent. V3 aims for idempotent `POST` wherever an operation

    allows it, but never assume a given `POST` is replayable: retrying one that timed out can create a

    second resource or fire an action twice. Retry a `POST` only if its own description says it is

    idempotent - otherwise re-read the collection to find out whether the first attempt landed.


    ### Destructive operations


    `DELETE`, and `POST` actions such as `cancel`, `delete`, `revoke` and `purge`, take effect

    immediately and normally cannot be undone. Treat them as irreversible: no operation here reverses

    another, and there is no dry-run mode. Where recovery is possible at all it is a support matter,

    not an API call.


    ### Errors


    Errors return a single `error` object, never an `errors` array:

    `{"error": {"type", "id", "title", "detail", "source"}}`. Branch on the status code; every member

    is optional. `error.type`, where present, separates causes within one status and is a bare token,

    not a URI. Never branch on `title` or `detail`. Quote `error.id` in support requests. Invalid input

    is always 400, never 422.


    ### Rate limits


    On 429, wait the `Retry-After` seconds, then back off exponentially. Responses carry

    `RateLimit-Policy` and `RateLimit`, the policy and the current state against it

    (IETF draft-ietf-httpapi-ratelimit-headers). Limits are per route and are not published: read the

    headers rather than assuming a figure.


    ### Caching


    Responses carry an `ETag` and a `Cache-Control` directive. Where a response has an `ETag`, send it

    back as `If-None-Match` to make the request conditional and get a 304 when nothing has changed.


    ### Deprecation


    A deprecated operation is marked `deprecated: true` and its responses carry `Deprecation`, whose

    value is `true` (RFC 9745), `Sunset`, the HTTP-date when the endpoint will be removed (RFC 8594),

    and `Link` with `rel="deprecation"`, pointing at the migration documentation (RFC 8288). Migrate

    before the `Sunset` date. A removed route returns 410, permanently.


    ### Additions


    Response fields are added without a version change. Ignore members you do not recognise rather

    than failing to parse.'
servers:
- url: https://circleci.com
security:
- bearer_token: []
tags:
- name: Orb Packages
  description: Reusable configuration packages published to the orb registry. Each orb belongs to a namespace and has one or more versioned releases.
paths:
  /api/v3/orb/packages:
    get:
      operationId: get-orb-packages
      tags:
      - Orb Packages
      summary: Returns a list of packages limited by the given filter
      parameters:
      - name: filter[certified]
        in: query
        schema:
          type: boolean
      - name: filter[name]
        in: query
        schema:
          type: string
      - name: filter[namespace_id]
        in: query
        schema:
          type: string
          format: uuid
      - name: filter[visibility]
        in: query
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped. The maximum is 1000.
        schema:
          type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        attributes:
                          type: object
                          properties:
                            is_listed:
                              type: boolean
                            is_private:
                              type: boolean
                            last_30_days_build_count:
                              type: integer
                            last_30_days_org_count:
                              type: integer
                            last_30_days_project_count:
                              type: integer
                            name:
                              type: string
                          required:
                          - is_listed
                          - is_private
                          - last_30_days_build_count
                          - last_30_days_org_count
                          - last_30_days_project_count
                          - name
                        id:
                          type: string
                          format: uuid
                        references:
                          type: object
                          properties:
                            namespace:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                            orb_categories:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  attributes:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                    required:
                                    - name
                                  id:
                                    type: string
                                    format: uuid
                                required:
                                - attributes
                                - id
                            orb_versions:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  attributes:
                                    type: object
                                    properties:
                                      created_at:
                                        type:
                                        - string
                                        - 'null'
                                        format: date-time
                                      version:
                                        type: string
                                    required:
                                    - version
                                  id:
                                    type: string
                                    format: uuid
                                required:
                                - attributes
                                - id
                          required:
                          - namespace
                      required:
                      - attributes
                      - id
                      - references
                  page:
                    type: object
                    properties:
                      next:
                        type:
                        - string
                        - 'null'
                      prev:
                        type:
                        - string
                        - 'null'
                required:
                - data
                - page
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: post-orb-packages
      tags:
      - Orb Packages
      summary: Creates a new orb package in the given namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        is_private:
                          type:
                          - boolean
                          - 'null'
                        name:
                          type: string
                      required:
                      - name
                    references:
                      type: object
                      properties:
                        namespace:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                          required:
                          - id
                      required:
                      - namespace
                  required:
                  - attributes
                  - references
              required:
              - data
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          created_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          home_url:
                            type:
                            - string
                            - 'null'
                          is_listed:
                            type: boolean
                          is_private:
                            type: boolean
                          last_30_days_build_count:
                            type: integer
                          last_30_days_org_count:
                            type: integer
                          last_30_days_project_count:
                            type: integer
                          name:
                            type: string
                        required:
                        - is_listed
                        - is_private
                        - last_30_days_build_count
                        - last_30_days_org_count
                        - last_30_days_project_count
                        - name
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          namespace:
                            type: object
                            properties:
                              attributes:
                                type: object
                                properties:
                                  name:
                                    type: string
                                required:
                                - name
                              id:
                                type: string
                                format: uuid
                            required:
                            - attributes
                            - id
                          orb_categories:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                attributes:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                  required:
                                  - name
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - attributes
                              - id
                          orb_versions:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                attributes:
                                  type: object
                                  properties:
                                    created_at:
                                      type:
                                      - string
                                      - 'null'
                                      format: date-time
                                    version:
                                      type: string
                                  required:
                                  - version
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - attributes
                              - id
                        required:
                        - namespace
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/orb/packages/import:
    post:
      operationId: post-orb-packages-import
      tags:
      - Orb Packages
      summary: Creates a new orb package via admin import
      requestBody:
