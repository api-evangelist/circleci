                        format: uuid
                      references:
                        type: object
                        properties:
                          namespace:
                            type: object
                            properties:
                              attributes:
                                type: object
                                properties:
                                  name:
                                    type: string
                                required:
                                - name
                              id:
                                type: string
                                format: uuid
                            required:
                            - attributes
                            - id
                          orb_categories:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                attributes:
                                  type: object
                                  properties:
