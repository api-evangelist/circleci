openapi: 3.2.0
info:
  title: CircleCI API V3 Provider Connections API
  version: '3.0'
  description: 'CircleCI''s V3 API. Every route is served under `/api/v3` on `https://circleci.com`.


    No standard is implemented. V3 takes the ideas that work from established API designs and

    combines them into one coherent whole, but it is not JSON:API, not `problem+json`, and not HAL.

    Familiar names like `data`, `attributes`, `source.pointer` and `filter[...]` carry no behaviour

    from those specs. Take everything from this document, and do not use a standard-conformant client

    library.


    ## Conventions


    ### Auth


    `Authorization: Bearer `. A token in a query parameter is rejected.


    ### Ids


    Ids are UUIDs, never slugs or names. Some collections resolve a slug via `filter[slug]`.


    ### One resource


    `{"data": {"id", "attributes", "references"}}`. Each entry in `references` is an `id`, or an array

    of them, sometimes carrying a nested `attributes` object of denormalised fields from the referenced

    resource. Read the operation''s schema for which fields those are, and fetch the resource itself for

    anything not listed - there is no way to request more inline.


    ### A collection


    `{"data": [...], "page": {"next", "prev"}}`. `page.next` and `page.prev` are opaque cursor values,

    not URLs - send one back as `page[cursor]`, unmodified, and stop when `page.next` is `null`.

    `page[limit]` bounds are per-operation, and out of range is a 400, not a clamp.


    ### Scoping


    Scoping uses `filter[...]`. Most list operations require a scope filter such as `filter[org_id]` or

    `filter[project_id]` and return 400 without it, so read the operation''s parameters.


    ### Methods


    `GET` reads, `POST` creates and performs named actions and partial updates, `PUT` replaces in full,

    `DELETE` removes. There is no `PATCH`.


    ### Retrying


    `GET`, `PUT` and `DELETE` are idempotent. V3 aims for idempotent `POST` wherever an operation

    allows it, but never assume a given `POST` is replayable: retrying one that timed out can create a

    second resource or fire an action twice. Retry a `POST` only if its own description says it is

    idempotent - otherwise re-read the collection to find out whether the first attempt landed.


    ### Destructive operations


    `DELETE`, and `POST` actions such as `cancel`, `delete`, `revoke` and `purge`, take effect

    immediately and normally cannot be undone. Treat them as irreversible: no operation here reverses

    another, and there is no dry-run mode. Where recovery is possible at all it is a support matter,

    not an API call.


    ### Errors


    Errors return a single `error` object, never an `errors` array:

    `{"error": {"type", "id", "title", "detail", "source"}}`. Branch on the status code; every member

    is optional. `error.type`, where present, separates causes within one status and is a bare token,

    not a URI. Never branch on `title` or `detail`. Quote `error.id` in support requests. Invalid input

    is always 400, never 422.


    ### Rate limits


    On 429, wait the `Retry-After` seconds, then back off exponentially. Responses carry

    `RateLimit-Policy` and `RateLimit`, the policy and the current state against it

    (IETF draft-ietf-httpapi-ratelimit-headers). Limits are per route and are not published: read the

    headers rather than assuming a figure.


    ### Caching


    Responses carry an `ETag` and a `Cache-Control` directive. Where a response has an `ETag`, send it

    back as `If-None-Match` to make the request conditional and get a 304 when nothing has changed.


    ### Deprecation


    A deprecated operation is marked `deprecated: true` and its responses carry `Deprecation`, whose

    value is `true` (RFC 9745), `Sunset`, the HTTP-date when the endpoint will be removed (RFC 8594),

    and `Link` with `rel="deprecation"`, pointing at the migration documentation (RFC 8288). Migrate

    before the `Sunset` date. A removed route returns 410, permanently.


    ### Additions


    Response fields are added without a version change. Ignore members you do not recognise rather

    than failing to parse.'
servers:
- url: https://circleci.com
security:
- bearer_token: []
tags:
- name: Provider Connections
  description: Connections between an organization and a VCS provider. Setup returns where to send the user; nothing is connected until they finish at the provider.
paths:
  /api/v3/provider/connections:
    get:
      operationId: get-provider-connections
      tags:
      - Provider Connections
      summary: Lists an organization's provider connections
      description: 'Returns every connection that authorizes CircleCI to act for the organization — a GitHub App installation, a GitHub Server installation, an Origin installation — with the provider''s live view of each. Custom webhook connections are not included. Requires filter[org_id] and view-org on that organization.


        Each item always carries its stored fields. The provider is also asked for the installation as it currently stands and for the calling user''s identity there; either failing degrades that item rather than the response, populating connection_error or authorization_error and omitting the fields it could not fill. An organization with no connections is an empty list, not a 404.


        A connection appears only once the customer has finished authorizing it at the provider. A setup that has been started and not completed is not listed, and is indistinguishable here from one that was never started.'
      parameters:
      - name: filter[org_id]
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                      required:
                      - id
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/provider/connections/setup:
    post:
      operationId: post-provider-connections-setup
      tags:
      - Provider Connections
      summary: Starts connecting a provider to an organization
      description: Returns where to send the user to finish the connection at the provider. next_step "redirect" carries the url that connects an app CircleCI has already registered with the provider; "register" carries a manifest and state_token for the user to register one first. Nothing is connected when this returns. Requires filter[org_id] and manage-org on that organization. Each call mints and stores a fresh state token, valid for one hour, so this endpoint is deliberately not idempotent.
      parameters:
      - name: filter[org_id]
        in: query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                return_url:
                  type:
                  - string
                  - 'null'
                type:
                  type: string
                vcs:
                  type:
                  - object
                  - 'null'
                  properties:
                    provider:
                      type: string
                    url:
                      type:
                      - string
                      - 'null'
                  required:
                  - provider
              required:
              - type
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          manifest: {}
                          next_step:
                            type: string
                          state_token:
                            type:
                            - string
                            - 'null'
                          url:
                            type:
                            - string
                            - 'null'
                        required:
                        - next_step
                    required:
                    - attributes
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/provider/connections/{id}:
    delete:
      operationId: delete-provider-connections-by-id
      tags:
      - Provider Connections
      summary: Deletes a provider connection by ID
      description: 'Removes the connection together with everything CircleCI holds beneath it — its repositories, and the pipelines and triggers built on them — and asks the provider to uninstall CircleCI''s app. The uninstall is best-effort: the connection is deleted even if the provider cannot be reached. Requires manage-org on the organization that owns the connection. Returns 204 with no body.'
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Internal server error. Safe to retry with backoff; quote error.id when reporting it.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limited. Wait the Retry-After header's seconds, then retry with backoff.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing, invalid or expired token. Do not retry without a new token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found - the resource does not exist, or the caller is not entitled to know that it does.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - authenticated but not permitted to perform this action. Do not retry.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    Error:
      properties:
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        id:
          description: Unique identifier for this occurrence. Include it when reporting the problem so support can find the failure.
          type: string
        source:
          description: Identifies the origin of the error in the request.
          properties:
            error:
              description: Underlying parser/validation error message.
              type: string
            offset:
              description: Byte offset in the JSON input where the error was detected.
              format: int64
              type: integer
            pointer:
              description: JSON Pointer (RFC 6901) to the field that caused the error.
              type: string
          type: object
        title:
          description: Short, human-readable summary of the problem.
          type: string
        type:
          description: 'Low-cardinality machine-readable error type, present only where an operation sets one explicitly - absent is normal, so branch on the HTTP status first and use this to tell causes apart within one status. A bare token, never a URI to dereference. The value set is open, so treat an unrecognised value as a generic failure for the status. Request-parsing errors use: syntax_error, empty_input, unknown_field, invalid_structure, invalid_format, type_mismatch, validation_error, invalid_route, invalid_path_param.'
          type: string
      type: object
  securitySchemes:
    bearer_token:
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: CircleCI
  source: https://circleci.com/fullopenapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
