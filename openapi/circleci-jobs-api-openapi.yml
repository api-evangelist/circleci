openapi: 3.2.0
info:
  title: CircleCI API V3 Jobs API
  version: '3.0'
  description: 'CircleCI''s V3 API. Every route is served under `/api/v3` on `https://circleci.com`.


    No standard is implemented. V3 takes the ideas that work from established API designs and

    combines them into one coherent whole, but it is not JSON:API, not `problem+json`, and not HAL.

    Familiar names like `data`, `attributes`, `source.pointer` and `filter[...]` carry no behaviour

    from those specs. Take everything from this document, and do not use a standard-conformant client

    library.


    ## Conventions


    ### Auth


    `Authorization: Bearer `. A token in a query parameter is rejected.


    ### Ids


    Ids are UUIDs, never slugs or names. Some collections resolve a slug via `filter[slug]`.


    ### One resource


    `{"data": {"id", "attributes", "references"}}`. Each entry in `references` is an `id`, or an array

    of them, sometimes carrying a nested `attributes` object of denormalised fields from the referenced

    resource. Read the operation''s schema for which fields those are, and fetch the resource itself for

    anything not listed - there is no way to request more inline.


    ### A collection


    `{"data": [...], "page": {"next", "prev"}}`. `page.next` and `page.prev` are opaque cursor values,

    not URLs - send one back as `page[cursor]`, unmodified, and stop when `page.next` is `null`.

    `page[limit]` bounds are per-operation, and out of range is a 400, not a clamp.


    ### Scoping


    Scoping uses `filter[...]`. Most list operations require a scope filter such as `filter[org_id]` or

    `filter[project_id]` and return 400 without it, so read the operation''s parameters.


    ### Methods


    `GET` reads, `POST` creates and performs named actions and partial updates, `PUT` replaces in full,

    `DELETE` removes. There is no `PATCH`.


    ### Retrying


    `GET`, `PUT` and `DELETE` are idempotent. V3 aims for idempotent `POST` wherever an operation

    allows it, but never assume a given `POST` is replayable: retrying one that timed out can create a

    second resource or fire an action twice. Retry a `POST` only if its own description says it is

    idempotent - otherwise re-read the collection to find out whether the first attempt landed.


    ### Destructive operations


    `DELETE`, and `POST` actions such as `cancel`, `delete`, `revoke` and `purge`, take effect

    immediately and normally cannot be undone. Treat them as irreversible: no operation here reverses

    another, and there is no dry-run mode. Where recovery is possible at all it is a support matter,

    not an API call.


    ### Errors


    Errors return a single `error` object, never an `errors` array:

    `{"error": {"type", "id", "title", "detail", "source"}}`. Branch on the status code; every member

    is optional. `error.type`, where present, separates causes within one status and is a bare token,

    not a URI. Never branch on `title` or `detail`. Quote `error.id` in support requests. Invalid input

    is always 400, never 422.


    ### Rate limits


    On 429, wait the `Retry-After` seconds, then back off exponentially. Responses carry

    `RateLimit-Policy` and `RateLimit`, the policy and the current state against it

    (IETF draft-ietf-httpapi-ratelimit-headers). Limits are per route and are not published: read the

    headers rather than assuming a figure.


    ### Caching


    Responses carry an `ETag` and a `Cache-Control` directive. Where a response has an `ETag`, send it

    back as `If-None-Match` to make the request conditional and get a 304 when nothing has changed.


    ### Deprecation


    A deprecated operation is marked `deprecated: true` and its responses carry `Deprecation`, whose

    value is `true` (RFC 9745), `Sunset`, the HTTP-date when the endpoint will be removed (RFC 8594),

    and `Link` with `rel="deprecation"`, pointing at the migration documentation (RFC 8288). Migrate

    before the `Sunset` date. A removed route returns 410, permanently.


    ### Additions


    Response fields are added without a version change. Ignore members you do not recognise rather

    than failing to parse.'
servers:
- url: https://circleci.com
security:
- bearer_token: []
tags:
- name: Jobs
  description: Individual units of work within a workflow. Each job runs in its own execution environment and produces artifacts, test results, and logs.
paths:
  /api/v3/jobs:
    get:
      operationId: get-jobs
      tags:
      - Jobs
      summary: Lists the jobs in a workflow
      parameters:
      - name: filter[workflow_id]
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        attributes:
                          type: object
                          properties:
                            ended_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            name:
                              type: string
                            number:
                              type: integer
                            outcome:
                              type:
                              - string
                              - 'null'
                            phase:
                              type: string
                            started_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            type:
                              type: string
                          required:
                          - name
                          - number
                          - phase
                          - type
                        id:
                          type: string
                          format: uuid
                        references:
                          type: object
                          properties:
                            project:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                            workflow:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                          required:
                          - project
                          - workflow
                      required:
                      - attributes
                      - id
                      - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}:
    get:
      operationId: get-jobs-by-id
      tags:
      - Jobs
      summary: Fetches a single job, including its steps and parallel executions
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          ended_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          name:
                            type: string
                          outcome:
                            type:
                            - string
                            - 'null'
                          parallel_executions:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                steps:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      command:
                                        type:
                                        - string
                                        - 'null'
                                      ended_at:
                                        type:
                                        - string
                                        - 'null'
                                        format: date-time
                                      exit_code:
                                        type:
                                        - integer
                                        - 'null'
                                      name:
                                        type: string
                                      num:
                                        type: integer
                                      outcome:
                                        type:
                                        - string
                                        - 'null'
                                      phase:
                                        type: string
                                      started_at:
                                        type:
                                        - string
                                        - 'null'
                                        format: date-time
                                      stderr_bytes:
                                        type:
                                        - integer
                                        - 'null'
                                      stdout_bytes:
                                        type:
                                        - integer
                                        - 'null'
                                      type:
                                        type: string
                                    required:
                                    - name
                                    - num
                                    - phase
                                    - type
                              required:
                              - steps
                          phase:
                            type: string
                          started_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          type:
                            type: string
                        required:
                        - name
                        - phase
                        - type
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          pipeline:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          user:
                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          workflow:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - pipeline
                        - project
                        - workflow
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/artifacts:
    get:
      operationId: get-jobs-by-id-artifacts
      tags:
      - Jobs
      summary: Lists the artifacts produced by a job's parallel executions
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        attributes:
                          type: object
                          properties:
                            execution:
                              type: integer
                            path:
                              type: string
                            url:
                              type: string
                          required:
                          - execution
                          - path
                          - url
                      required:
                      - attributes
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/resource-usage:
    get:
      operationId: get-jobs-by-id-resource-usage
      tags:
      - Jobs
      summary: Returns a job's recorded resource usage per parallel execution
      description: 'Each execution reports ordered CPU, memory and network samples taken interval_ms apart, alongside the resource class the job was dispatched to. Samples carry no timestamps: the first sample is the first collection tick after the execution started.


        Only Docker executions record samples, so machine and runner jobs return an empty parallel_executions list. Recordings expire after 90 days, and an execution that recorded nothing is absent from the list rather than empty, so a missing execution is not an execution that did not run.'
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          parallel_executions:
                            type: array
                            items:
                              type: object
                              properties:
                                cpu_cores:
                                  type: array
                                  items:
                                    type: number
                                execution:
                                  type: integer
                                interval_ms:
                                  type: integer
                                memory_bytes:
                                  type: array
                                  items:
                                    type: integer
                                network_rx_bytes:
                                  type: integer
                                network_tx_bytes:
                                  type: integer
                              required:
                              - cpu_cores
                              - execution
                              - interval_ms
                              - memory_bytes
                              - network_rx_bytes
                              - network_tx_bytes
                          resource_class:
                            type:
                            - object
                            - 'null'
                            properties:
                              cpu_count:
                                type: integer
                              memory_limit_bytes:
                                type: integer
                              name:
                                type: string
                            required:
                            - cpu_count
                            - memory_limit_bytes
                            - name
                        required:
                        - parallel_executions
                      id:
                        type: string
                        format: uuid
                    required:
                    - attributes
                    - id
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/stderr:
    get:
      operationId: get-jobs-by-id-stderr
      tags:
      - Jobs
      summary: Returns the stderr of a job step for a given parallel execution
      description: Parallel executions are numbered from 0. filter[execution] is optional and defaults to 0, which is the only execution a job with the default parallelism of 1 has.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      - name: filter[execution]
        in: query
        description: Which of a job's parallel executions to read, numbered from 0. Defaults to 0, the only execution a job with the default parallelism of 1 has.
        schema:
          type: integer
      - name: filter[step_num]
        in: query
        required: true
        schema:
          type: integer
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/stdout:
    get:
      operationId: get-jobs-by-id-stdout
      tags:
      - Jobs
      summary: Returns the stdout of a job step for a given parallel execution
      description: Parallel executions are numbered from 0. filter[execution] is optional and defaults to 0, which is the only execution a job with the default parallelism of 1 has.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      - name: filter[execution]
        in: query
        description: Which of a job's parallel executions to read, numbered from 0. Defaults to 0, the only execution a job with the default parallelism of 1 has.
        schema:
          type: integer
      - name: filter[step_num]
        in: query
        required: true
        schema:
          type: integer
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/stdout/condensed:
    get:
      operationId: get-jobs-by-id-stdout-condensed
      tags:
      - Jobs
      summary: Returns a step's stdout condensed to its most error-relevant lines, suitable…
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      - name: filter[execution]
        in: query
        required: true
        description: Which of a job's parallel executions to read, numbered from 0. Defaults to 0, the only execution a job with the default parallelism of 1 has.
        schema:
          type: integer
      - name: filter[step_num]
        in: query
        required: true
        schema:
          type: integer
      responses:
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/test-atoms:
    get:
      operationId: get-jobs-by-id-test-atoms
      tags:
      - Jobs
      summary: Returns a job's test atoms as JSON Lines
      description: EXPERIMENTAL — This endpoint is experimental and may change without notice. Field names and response shapes are not yet stable. Do not depend on this endpoint in production clients.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/tests:
    get:
      operationId: get-jobs-by-id-tests
      tags:
      - Jobs
      summary: Returns a job's structured test results as JSON Lines
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/jobs/{id}/testsuite-metadata:
    get:
      operationId: get-jobs-by-id-testsuite-metadata
      tags:
      - Jobs
      summary: Returns a job's testsuite metadata as JSON Lines
      description: EXPERIMENTAL — This endpoint is experimental and may change without notice. Field names and response shapes are not yet stable. Do not depend on this endpoint in production clients.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Internal server error. Safe to retry with backoff; quote error.id when reporting it.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limited. Wait the Retry-After header's seconds, then retry with backoff.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing, invalid or expired token. Do not retry without a new token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found - the resource does not exist, or the caller is not entitled to know that it does.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - authenticated but not permitted to perform this action. Do not retry.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    Error:
      properties:
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        id:
          description: Unique identifier for this occurrence. Include it when reporting the problem so support can find the failure.
          type: string
        source:
          description: Identifies the origin of the error in the request.
          properties:
            error:
              description: Underlying parser/validation error message.
              type: string
            offset:
              description: Byte offset in the JSON input where the error was detected.
              format: int64
              type: integer
            pointer:
              description: JSON Pointer (RFC 6901) to the field that caused the error.
              type: string
          type: object
        title:
          description: Short, human-readable summary of the problem.
          type: string
        type:
          description: 'Low-cardinality machine-readable error type, present only where an operation sets one explicitly - absent is normal, so branch on the HTTP status first and use this to tell causes apart within one status. A bare token, never a URI to dereference. The value set is open, so treat an unrecognised value as a generic failure for the status. Request-parsing errors use: syntax_error, empty_input, unknown_field, invalid_structure, invalid_format, type_mismatch, validation_error, invalid_route, invalid_path_param.'
          type: string
      type: object
  securitySchemes:
    bearer_token:
      scheme: bearer
      type: http
