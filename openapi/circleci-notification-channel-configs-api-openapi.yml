openapi: 3.2.0
info:
  title: CircleCI API V3 Notification Channel Configs API
  version: '3.0'
  description: 'CircleCI''s V3 API. Every route is served under `/api/v3` on `https://circleci.com`.


    No standard is implemented. V3 takes the ideas that work from established API designs and

    combines them into one coherent whole, but it is not JSON:API, not `problem+json`, and not HAL.

    Familiar names like `data`, `attributes`, `source.pointer` and `filter[...]` carry no behaviour

    from those specs. Take everything from this document, and do not use a standard-conformant client

    library.


    ## Conventions


    ### Auth


    `Authorization: Bearer `. A token in a query parameter is rejected.


    ### Ids


    Ids are UUIDs, never slugs or names. Some collections resolve a slug via `filter[slug]`.


    ### One resource


    `{"data": {"id", "attributes", "references"}}`. Each entry in `references` is an `id`, or an array

    of them, sometimes carrying a nested `attributes` object of denormalised fields from the referenced

    resource. Read the operation''s schema for which fields those are, and fetch the resource itself for

    anything not listed - there is no way to request more inline.


    ### A collection


    `{"data": [...], "page": {"next", "prev"}}`. `page.next` and `page.prev` are opaque cursor values,

    not URLs - send one back as `page[cursor]`, unmodified, and stop when `page.next` is `null`.

    `page[limit]` bounds are per-operation, and out of range is a 400, not a clamp.


    ### Scoping


    Scoping uses `filter[...]`. Most list operations require a scope filter such as `filter[org_id]` or

    `filter[project_id]` and return 400 without it, so read the operation''s parameters.


    ### Methods


    `GET` reads, `POST` creates and performs named actions and partial updates, `PUT` replaces in full,

    `DELETE` removes. There is no `PATCH`.


    ### Retrying


    `GET`, `PUT` and `DELETE` are idempotent. V3 aims for idempotent `POST` wherever an operation

    allows it, but never assume a given `POST` is replayable: retrying one that timed out can create a

    second resource or fire an action twice. Retry a `POST` only if its own description says it is

    idempotent - otherwise re-read the collection to find out whether the first attempt landed.


    ### Destructive operations


    `DELETE`, and `POST` actions such as `cancel`, `delete`, `revoke` and `purge`, take effect

    immediately and normally cannot be undone. Treat them as irreversible: no operation here reverses

    another, and there is no dry-run mode. Where recovery is possible at all it is a support matter,

    not an API call.


    ### Errors


    Errors return a single `error` object, never an `errors` array:

    `{"error": {"type", "id", "title", "detail", "source"}}`. Branch on the status code; every member

    is optional. `error.type`, where present, separates causes within one status and is a bare token,

    not a URI. Never branch on `title` or `detail`. Quote `error.id` in support requests. Invalid input

    is always 400, never 422.


    ### Rate limits


    On 429, wait the `Retry-After` seconds, then back off exponentially. Responses carry

    `RateLimit-Policy` and `RateLimit`, the policy and the current state against it

    (IETF draft-ietf-httpapi-ratelimit-headers). Limits are per route and are not published: read the

    headers rather than assuming a figure.


    ### Caching


    Responses carry an `ETag` and a `Cache-Control` directive. Where a response has an `ETag`, send it

    back as `If-None-Match` to make the request conditional and get a 304 when nothing has changed.


    ### Deprecation


    A deprecated operation is marked `deprecated: true` and its responses carry `Deprecation`, whose

    value is `true` (RFC 9745), `Sunset`, the HTTP-date when the endpoint will be removed (RFC 8594),

    and `Link` with `rel="deprecation"`, pointing at the migration documentation (RFC 8288). Migrate

    before the `Sunset` date. A removed route returns 410, permanently.


    ### Additions


    Response fields are added without a version change. Ignore members you do not recognise rather

    than failing to parse.'
servers:
- url: https://circleci.com
security:
- bearer_token: []
tags:
- name: Notification Channel Configs
  description: Per-user and per-project notification channel configuration — the email address or Slack channel a notification is delivered to.
paths:
  /api/v3/notification/channel-configs:
    get:
      operationId: get-notification-channel-configs
      tags:
      - Notification Channel Configs
      summary: Serves the V3 channel-config collection
      description: 'The collection is paginated with page[limit] and page[cursor]; clients must follow page.next until it is absent. filter[scope] selects user or project scope.


        scope=user returns the caller''s configs, narrowed to one org by the optional filter[org_id].


        scope=project requires filter[org_id]. With filter[project_id] it returns that project''s configs; without it, it returns the configs of every project in the org.'
      parameters:
      - name: filter[org_id]
        in: query
        schema:
          type: string
          format: uuid
      - name: filter[project_id]
        in: query
        schema:
          type: string
          format: uuid
      - name: filter[scope]
        in: query
        required: true
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped.
        schema:
          type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        attributes:
                          type: object
                          properties:
                            channel_name:
                              type:
                              - string
                              - 'null'
                            channel_type:
                              type: string
                            disable_reason:
                              type:
                              - string
                              - 'null'
                            is_enabled:
                              type: boolean
                            target:
                              type:
                              - string
                              - 'null'
                          required:
                          - channel_type
                          - is_enabled
                        id:
                          type: string
                          format: uuid
                        references:
                          type: object
                          properties:
                            org:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                            project:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                            user:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                          required:
                          - org
                          - project
                          - user
                      required:
                      - attributes
                      - id
                      - references
                  page:
                    type: object
                    properties:
                      next:
                        type:
                        - string
                        - 'null'
                      prev:
                        type:
                        - string
                        - 'null'
                required:
                - data
                - page
        400:
          description: Filter[scope] must be "user" or "project"
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: post-notification-channel-configs
      tags:
      - Notification Channel Configs
      summary: Creates (or replaces) a channel config
      description: It returns 201 when it creates the config and 200 when it replaces one. Scope comes from data.attributes.scope; user scope requires an org reference, project scope requires project + org references.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        channel_type:
                          type: string
                        is_enabled:
                          type: boolean
                        scope:
                          type: string
                        target:
                          type:
                          - string
                          - 'null'
                      required:
                      - channel_type
                      - is_enabled
                      - scope
                    references:
                      type: object
                      properties:
                        org:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                          required:
                          - id
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                          required:
                          - id
                      required:
                      - org
                      - project
                  required:
                  - attributes
                  - references
              required:
              - data
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          channel_name:
                            type:
                            - string
                            - 'null'
                          channel_type:
                            type: string
                          disable_reason:
                            type:
                            - string
                            - 'null'
                          is_enabled:
                            type: boolean
                          target:
                            type:
                            - string
                            - 'null'
                        required:
                        - channel_type
                        - is_enabled
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          org:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - org
                        - project
                        - user
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          channel_name:
                            type:
                            - string
                            - 'null'
                          channel_type:
                            type: string
                          disable_reason:
                            type:
                            - string
                            - 'null'
                          is_enabled:
                            type: boolean
                          target:
                            type:
                            - string
                            - 'null'
                        required:
                        - channel_type
                        - is_enabled
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          org:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - org
                        - project
                        - user
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Invalid channel_type
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/notification/channel-configs/{id}:
    get:
      operationId: get-notification-channel-configs-by-id
      tags:
      - Notification Channel Configs
      summary: Returns a single channel config addressed by its row id
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          channel_name:
                            type:
                            - string
                            - 'null'
                          channel_type:
                            type: string
                          disable_reason:
                            type:
                            - string
                            - 'null'
                          is_enabled:
                            type: boolean
                          target:
                            type:
                            - string
                            - 'null'
                        required:
                        - channel_type
                        - is_enabled
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          org:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - org
                        - project
                        - user
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: delete-notification-channel-configs-by-id
      tags:
      - Notification Channel Configs
      summary: Deletes the channel config addressed by id
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/notification/channel-configs/{id}/update:
    post:
      operationId: post-notification-channel-configs-by-id-update
      tags:
      - Notification Channel Configs
      summary: Applies a partial update to the channel config
      description: Only target and/or is_enabled may change; the config is addressed by id. The same fields wrapped in data.attributes are still accepted; that form is deprecated.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        is_enabled:
                          type:
                          - boolean
                          - 'null'
                        target:
                          type:
                          - string
                          - 'null'
                  required:
                  - attributes
                is_enabled:
                  type:
                  - boolean
                  - 'null'
                target:
                  type:
                  - string
                  - 'null'
              required:
              - data
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          channel_name:
                            type:
                            - string
                            - 'null'
                          channel_type:
                            type: string
                          disable_reason:
                            type:
                            - string
                            - 'null'
                          is_enabled:
                            type: boolean
                          target:
                            type:
                            - string
                            - 'null'
                        required:
                        - channel_type
                        - is_enabled
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          org:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - org
                        - project
                        - user
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Internal server error. Safe to retry with backoff; quote error.id when reporting it.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limited. Wait the Retry-After header's seconds, then retry with backoff.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing, invalid or expired token. Do not retry without a new token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found - the resource does not exist, or the caller is not entitled to know that it does.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - authenticated but not permitted to perform this action. Do not retry.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    Error:
      properties:
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        id:
          description: Unique identifier for this occurrence. Include it when reporting the problem so support can find the failure.
          type: string
        source:
          description: Identifies the origin of the error in the request.
          properties:
            error:
              description: Underlying parser/validation error message.
              type: string
            offset:
              description: Byte offset in the JSON input where the error was detected.
              format: int64
              type: integer
            pointer:
              description: JSON Pointer (RFC 6901) to the field that caused the error.
              type: string
          type: object
        title:
          description: Short, human-readable summary of the problem.
          type: string
        type:
          description: 'Low-cardinality machine-readable error type, present only where an operation sets one explicitly - absent is normal, so branch on the HTTP status first and use this to tell causes apart within one status. A bare token, never a URI to dereference. The value set is open, so treat an unrecognised value as a generic failure for the status. Request-parsing errors use: syntax_error, empty_input, unknown_field, invalid_structure, invalid_format, type_mismatch, validation_error, invalid_route, invalid_path_param.'
          type: string
      type: object
  securitySchemes:
    bearer_token:
      scheme: bearer
      type: http
