openapi: 3.2.0
info:
  title: CircleCI API V3 Workflows API
  version: '3.0'
  description: 'CircleCI''s V3 API. Every route is served under `/api/v3` on `https://circleci.com`.


    No standard is implemented. V3 takes the ideas that work from established API designs and

    combines them into one coherent whole, but it is not JSON:API, not `problem+json`, and not HAL.

    Familiar names like `data`, `attributes`, `source.pointer` and `filter[...]` carry no behaviour

    from those specs. Take everything from this document, and do not use a standard-conformant client

    library.


    ## Conventions


    ### Auth


    `Authorization: Bearer `. A token in a query parameter is rejected.


    ### Ids


    Ids are UUIDs, never slugs or names. Some collections resolve a slug via `filter[slug]`.


    ### One resource


    `{"data": {"id", "attributes", "references"}}`. Each entry in `references` is an `id`, or an array

    of them, sometimes carrying a nested `attributes` object of denormalised fields from the referenced

    resource. Read the operation''s schema for which fields those are, and fetch the resource itself for

    anything not listed - there is no way to request more inline.


    ### A collection


    `{"data": [...], "page": {"next", "prev"}}`. `page.next` and `page.prev` are opaque cursor values,

    not URLs - send one back as `page[cursor]`, unmodified, and stop when `page.next` is `null`.

    `page[limit]` bounds are per-operation, and out of range is a 400, not a clamp.


    ### Scoping


    Scoping uses `filter[...]`. Most list operations require a scope filter such as `filter[org_id]` or

    `filter[project_id]` and return 400 without it, so read the operation''s parameters.


    ### Methods


    `GET` reads, `POST` creates and performs named actions and partial updates, `PUT` replaces in full,

    `DELETE` removes. There is no `PATCH`.


    ### Retrying


    `GET`, `PUT` and `DELETE` are idempotent. V3 aims for idempotent `POST` wherever an operation

    allows it, but never assume a given `POST` is replayable: retrying one that timed out can create a

    second resource or fire an action twice. Retry a `POST` only if its own description says it is

    idempotent - otherwise re-read the collection to find out whether the first attempt landed.


    ### Destructive operations


    `DELETE`, and `POST` actions such as `cancel`, `delete`, `revoke` and `purge`, take effect

    immediately and normally cannot be undone. Treat them as irreversible: no operation here reverses

    another, and there is no dry-run mode. Where recovery is possible at all it is a support matter,

    not an API call.


    ### Errors


    Errors return a single `error` object, never an `errors` array:

    `{"error": {"type", "id", "title", "detail", "source"}}`. Branch on the status code; every member

    is optional. `error.type`, where present, separates causes within one status and is a bare token,

    not a URI. Never branch on `title` or `detail`. Quote `error.id` in support requests. Invalid input

    is always 400, never 422.


    ### Rate limits


    On 429, wait the `Retry-After` seconds, then back off exponentially. Responses carry

    `RateLimit-Policy` and `RateLimit`, the policy and the current state against it

    (IETF draft-ietf-httpapi-ratelimit-headers). Limits are per route and are not published: read the

    headers rather than assuming a figure.


    ### Caching


    Responses carry an `ETag` and a `Cache-Control` directive. Where a response has an `ETag`, send it

    back as `If-None-Match` to make the request conditional and get a 304 when nothing has changed.


    ### Deprecation


    A deprecated operation is marked `deprecated: true` and its responses carry `Deprecation`, whose

    value is `true` (RFC 9745), `Sunset`, the HTTP-date when the endpoint will be removed (RFC 8594),

    and `Link` with `rel="deprecation"`, pointing at the migration documentation (RFC 8288). Migrate

    before the `Sunset` date. A removed route returns 410, permanently.


    ### Additions


    Response fields are added without a version change. Ignore members you do not recognise rather

    than failing to parse.'
servers:
- url: https://circleci.com
security:
- bearer_token: []
tags:
- name: Workflows
  description: Workflows organise jobs into a dependency graph. A run may produce multiple workflows that execute in parallel or sequence.
paths:
  /api/v3/workflows:
    get:
      operationId: get-workflows
      tags:
      - Workflows
      summary: Lists the workflows in a run
      description: List the workflows in a run. Filter by the required filter[run_id]. The optional order_by query parameter accepts "created asc" or "created desc" (default created desc / newest first).
      parameters:
      - name: filter[run_id]
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: order_by
        in: query
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped. The maximum is 20.
        schema:
          type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        attributes:
                          type: object
                          properties:
                            auto_rerun:
                              type:
                              - object
                              - 'null'
                              properties:
                                max_reruns:
                                  type: integer
                                number:
                                  type: integer
                              required:
                              - max_reruns
                              - number
                            created_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            current_outcome:
                              type:
                              - string
                              - 'null'
                            ended_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            name:
                              type: string
                            outcome:
                              type:
                              - string
                              - 'null'
                            phase:
                              type: string
                            tag:
                              type:
                              - string
                              - 'null'
                          required:
                          - name
                          - phase
                        id:
                          type: string
                          format: uuid
                        references:
                          type: object
                          properties:
                            project:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                            run:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                            user:
                              type:
                              - object
                              - 'null'
                              properties:
                                id:
                                  type: string
                                  format: uuid
                              required:
                              - id
                          required:
                          - project
                          - run
                      required:
                      - attributes
                      - id
                      - references
                  page:
                    type: object
                    properties:
                      next:
                        type:
                        - string
                        - 'null'
                      prev:
                        type:
                        - string
                        - 'null'
                required:
                - data
                - page
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/workflows/{id}:
    get:
      operationId: get-workflows-by-id
      tags:
      - Workflows
      summary: Retrieve a single workflow by its ID
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          auto_rerun:
                            type:
                            - object
                            - 'null'
                            properties:
                              max_reruns:
                                type: integer
                              number:
                                type: integer
                            required:
                            - max_reruns
                            - number
                          created_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          current_outcome:
                            type:
                            - string
                            - 'null'
                          ended_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          name:
                            type: string
                          outcome:
                            type:
                            - string
                            - 'null'
                          phase:
                            type: string
                          tag:
                            type:
                            - string
                            - 'null'
                        required:
                        - name
                        - phase
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          run:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                          user:
                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - project
                        - run
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/workflows/{id}/cancel:
    post:
      operationId: post-workflows-by-id-cancel
      tags:
      - Workflows
      summary: Requests cancellation of a workflow
      description: Cancellation is processed asynchronously, so the endpoint returns 202 Accepted with the workflow's id rather than a representation of its final state.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        202:
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                    required:
                    - id
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/workflows/{id}/rerun:
    post:
      operationId: post-workflows-by-id-rerun
      tags:
      - Workflows
      summary: Reruns an existing workflow, creating and returning a new workflow
      description: By default every job is rerun; set is_from_failed to rerun only the failed jobs and their dependents. The source workflow is not modified.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_from_failed:
                  type:
                  - boolean
                  - 'null'
                is_ssh_enabled:
                  type:
                  - boolean
                  - 'null'
                jobs:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    format: uuid
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                    required:
                    - id
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Internal server error. Safe to retry with backoff; quote error.id when reporting it.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limited. Wait the Retry-After header's seconds, then retry with backoff.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing, invalid or expired token. Do not retry without a new token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found - the resource does not exist, or the caller is not entitled to know that it does.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - authenticated but not permitted to perform this action. Do not retry.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    Error:
      properties:
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        id:
          description: Unique identifier for this occurrence. Include it when reporting the problem so support can find the failure.
          type: string
        source:
          description: Identifies the origin of the error in the request.
          properties:
            error:
              description: Underlying parser/validation error message.
              type: string
            offset:
              description: Byte offset in the JSON input where the error was detected.
              format: int64
              type: integer
            pointer:
              description: JSON Pointer (RFC 6901) to the field that caused the error.
              type: string
          type: object
        title:
          description: Short, human-readable summary of the problem.
          type: string
        type:
          description: 'Low-cardinality machine-readable error type, present only where an operation sets one explicitly - absent is normal, so branch on the HTTP status first and use this to tell causes apart within one status. A bare token, never a URI to dereference. The value set is open, so treat an unrecognised value as a generic failure for the status. Request-parsing errors use: syntax_error, empty_input, unknown_field, invalid_structure, invalid_format, type_mismatch, validation_error, invalid_route, invalid_path_param.'
          type: string
      type: object
  securitySchemes:
    bearer_token:
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: CircleCI
  source: https://circleci.com/fullopenapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
