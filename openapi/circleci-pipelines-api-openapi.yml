openapi: 3.2.0
info:
  title: CircleCI API V3 Pipelines API
  version: '3.0'
  description: 'CircleCI''s V3 API. Every route is served under `/api/v3` on `https://circleci.com`.


    No standard is implemented. V3 takes the ideas that work from established API designs and

    combines them into one coherent whole, but it is not JSON:API, not `problem+json`, and not HAL.

    Familiar names like `data`, `attributes`, `source.pointer` and `filter[...]` carry no behaviour

    from those specs. Take everything from this document, and do not use a standard-conformant client

    library.


    ## Conventions


    ### Auth


    `Authorization: Bearer `. A token in a query parameter is rejected.


    ### Ids


    Ids are UUIDs, never slugs or names. Some collections resolve a slug via `filter[slug]`.


    ### One resource


    `{"data": {"id", "attributes", "references"}}`. Each entry in `references` is an `id`, or an array

    of them, sometimes carrying a nested `attributes` object of denormalised fields from the referenced

    resource. Read the operation''s schema for which fields those are, and fetch the resource itself for

    anything not listed - there is no way to request more inline.


    ### A collection


    `{"data": [...], "page": {"next", "prev"}}`. `page.next` and `page.prev` are opaque cursor values,

    not URLs - send one back as `page[cursor]`, unmodified, and stop when `page.next` is `null`.

    `page[limit]` bounds are per-operation, and out of range is a 400, not a clamp.


    ### Scoping


    Scoping uses `filter[...]`. Most list operations require a scope filter such as `filter[org_id]` or

    `filter[project_id]` and return 400 without it, so read the operation''s parameters.


    ### Methods


    `GET` reads, `POST` creates and performs named actions and partial updates, `PUT` replaces in full,

    `DELETE` removes. There is no `PATCH`.


    ### Retrying


    `GET`, `PUT` and `DELETE` are idempotent. V3 aims for idempotent `POST` wherever an operation

    allows it, but never assume a given `POST` is replayable: retrying one that timed out can create a

    second resource or fire an action twice. Retry a `POST` only if its own description says it is

    idempotent - otherwise re-read the collection to find out whether the first attempt landed.


    ### Destructive operations


    `DELETE`, and `POST` actions such as `cancel`, `delete`, `revoke` and `purge`, take effect

    immediately and normally cannot be undone. Treat them as irreversible: no operation here reverses

    another, and there is no dry-run mode. Where recovery is possible at all it is a support matter,

    not an API call.


    ### Errors


    Errors return a single `error` object, never an `errors` array:

    `{"error": {"type", "id", "title", "detail", "source"}}`. Branch on the status code; every member

    is optional. `error.type`, where present, separates causes within one status and is a bare token,

    not a URI. Never branch on `title` or `detail`. Quote `error.id` in support requests. Invalid input

    is always 400, never 422.


    ### Rate limits


    On 429, wait the `Retry-After` seconds, then back off exponentially. Responses carry

    `RateLimit-Policy` and `RateLimit`, the policy and the current state against it

    (IETF draft-ietf-httpapi-ratelimit-headers). Limits are per route and are not published: read the

    headers rather than assuming a figure.


    ### Caching


    Responses carry an `ETag` and a `Cache-Control` directive. Where a response has an `ETag`, send it

    back as `If-None-Match` to make the request conditional and get a 304 when nothing has changed.


    ### Deprecation


    A deprecated operation is marked `deprecated: true` and its responses carry `Deprecation`, whose

    value is `true` (RFC 9745), `Sunset`, the HTTP-date when the endpoint will be removed (RFC 8594),

    and `Link` with `rel="deprecation"`, pointing at the migration documentation (RFC 8288). Migrate

    before the `Sunset` date. A removed route returns 410, permanently.


    ### Additions


    Response fields are added without a version change. Ignore members you do not recognise rather

    than failing to parse.'
servers:
- url: https://circleci.com
security:
- bearer_token: []
tags:
- name: Pipelines
  description: Pipeline definitions describe how to build, test, and deploy a project.
paths:
  /api/v3/pipelines:
    get:
      operationId: get-pipelines
      tags:
      - Pipelines
      summary: Lists a project's pipelines, including its synthetic OAuth pipeline
      description: filter[project_id] is required — there is no unscoped/global listing. A pipeline that can be fetched via Get must also appear in this listing.
      parameters:
      - name: filter[project_id]
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                      required:
                      - id
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: post-pipelines
      tags:
      - Pipelines
      summary: Creates a pipeline (config source) under the project named by project_id
      description: Returns the full created entity (shape-identical to Get).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        checkout:
                          type: object
                          properties:
                            vcs:
                              type: object
                              properties:
                                provider:
                                  type: string
                                repo_full_name:
                                  type: string
                                repo_id:
                                  type: string
                              required:
                              - provider
                              - repo_full_name
                              - repo_id
                          required:
                          - vcs
                        config:
                          type: object
                          properties:
                            file_path:
                              type: string
                            file_type:
                              type:
                              - string
                              - 'null'
                            hosted:
                              type:
                              - object
                              - 'null'
                              properties:
                                provider:
                                  type: string
                              required:
                              - provider
                            type:
                              type: string
                            vcs:
                              type:
                              - object
                              - 'null'
                              properties:
                                provider:
                                  type: string
                                repo_full_name:
                                  type: string
                                repo_id:
                                  type: string
                              required:
                              - provider
                              - repo_full_name
                              - repo_id
                          required:
                          - file_path
                          - type
                        description:
                          type:
                          - string
                          - 'null'
                        name:
                          type: string
                      required:
                      - checkout
                      - config
                      - name
                    references:
                      type: object
                      properties:
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                          required:
                          - id
                      required:
                      - project
                  required:
                  - attributes
                  - references
              required:
              - data
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          checkout:
                            type: object
                            properties:
                              type:
                                type: string
                              vcs:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                            required:
                            - type
                          config:
                            type: object
                            properties:
                              file_path:
                                type: string
                              file_type:
                                type: string
                              hosted:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                required:
                                - provider
                              type:
                                type: string
                              vcs:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                            required:
                            - file_path
                            - file_type
                            - type
                          created_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          description:
                            type:
                            - string
                            - 'null'
                          name:
                            type: string
                        required:
                        - checkout
                        - config
                        - name
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - project
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/pipelines/{id}:
    get:
      operationId: get-pipelines-by-id
      tags:
      - Pipelines
      summary: Gets a pipeline by ID
      description: The optional filter[project_id] query parameter scopes the lookup; it is required to resolve synthetic OAuth pipelines, which have no stored row and are derived from the project.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          checkout:
                            type: object
                            properties:
                              type:
                                type: string
                              vcs:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                            required:
                            - type
                          config:
                            type: object
                            properties:
                              file_path:
                                type: string
                              file_type:
                                type: string
                              hosted:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                required:
                                - provider
                              type:
                                type: string
                              vcs:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                            required:
                            - file_path
                            - file_type
                            - type
                          created_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          description:
                            type:
                            - string
                            - 'null'
                          name:
                            type: string
                        required:
                        - checkout
                        - config
                        - name
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - project
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: delete-pipelines-by-id
      tags:
      - Pipelines
      summary: Deletes a pipeline by ID
      description: The optional filter[project_id] query parameter scopes the lookup; it is required to identify synthetic OAuth pipelines, which have no stored row and are derived from the project.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
  /api/v3/pipelines/{id}/update:
    post:
      operationId: post-pipelines-by-id-update
      tags:
      - Pipelines
      summary: Partially updates a pipeline by ID
      description: Only the fields present in the request body (name, description, config.file_path) are changed. The optional filter[project_id] query parameter scopes the lookup; synthetic OAuth pipelines have no stored row and cannot be updated.
      parameters:
      - name: id
        in: path
        required: true
        description: The id.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type:
                  - object
                  - 'null'
                  properties:
                    file_path:
                      type:
                      - string
                      - 'null'
                    file_type:
                      type:
                      - string
                      - 'null'
                description:
                  type:
                  - string
                  - 'null'
                name:
                  type:
                  - string
                  - 'null'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          checkout:
                            type: object
                            properties:
                              type:
                                type: string
                              vcs:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                            required:
                            - type
                          config:
                            type: object
                            properties:
                              file_path:
                                type: string
                              file_type:
                                type: string
                              hosted:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                required:
                                - provider
                              type:
                                type: string
                              vcs:
                                type:
                                - object
                                - 'null'
                                properties:
                                  provider:
                                    type: string
                                  repo_full_name:
                                    type:
                                    - string
                                    - 'null'
                                  repo_id:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - provider
                            required:
                            - file_path
                            - file_type
                            - type
                          created_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          description:
                            type:
                            - string
                            - 'null'
                          name:
                            type: string
                        required:
                        - checkout
                        - config
                        - name
                      id:
                        type: string
                        format: uuid
                      references:
                        type: object
                        properties:
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                            required:
                            - id
                        required:
                        - project
                    required:
                    - attributes
                    - id
                    - references
                required:
                - data
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Internal server error. Safe to retry with backoff; quote error.id when reporting it.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limited. Wait the Retry-After header's seconds, then retry with backoff.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - missing, invalid or expired token. Do not retry without a new token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found - the resource does not exist, or the caller is not entitled to know that it does.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - authenticated but not permitted to perform this action. Do not retry.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    Error:
      properties:
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        id:
          description: Unique identifier for this occurrence. Include it when reporting the problem so support can find the failure.
          type: string
        source:
          description: Identifies the origin of the error in the request.
          properties:
            error:
              description: Underlying parser/validation error message.
              type: string
            offset:
              description: Byte offset in the JSON input where the error was detected.
              format: int64
              type: integer
            pointer:
              description: JSON Pointer (RFC 6901) to the field that caused the error.
              type: string
          type: object
        title:
          description: Short, human-readable summary of the problem.
          type: string
        type:
          description: 'Low-cardinality machine-readable error type, present only where an operation sets one explicitly - absent is normal, so branch on the HTTP status first and use this to tell causes apart within one status. A bare token, never a URI to dereference. The value set is open, so treat an unrecognised value as a generic failure for the status. Request-parsing errors use: syntax_error, empty_input, unknown_field, invalid_structure, invalid_format, type_mismatch, validation_error, invalid_route, invalid_path_param.'
          type: string
      type: object
  securitySchemes:
    bearer_token:
      scheme: bearer
      type: http
