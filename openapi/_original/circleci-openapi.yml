                                                            nullable: true
                                                        ended_at:
                                                            type: string
                                                            format: date-time
                                                            nullable: true
                                                        name:
                                                            type: string
                                                        outcome:
                                                            type: string
                                                            nullable: true
                                                        phase:
                                                            type: string
                                                        tag:
                                                            type: string
                                                            nullable: true
                                                    required:
                                                        - name
