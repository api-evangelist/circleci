            operationId: get-workflows
            tags:
                - Workflows
            summary: Lists the workflows in a run.
            description: List the workflows in a run. Filter by the required filter[run_id]. The optional order_by query parameter accepts "created asc" or "created desc" (default created desc / newest first).
            parameters:
                - name: filter[run_id]
                  in: query
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: order_by
                  in: query
                  schema:
                    type: string
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped. The maximum is 20.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        auto_rerun:
                                                            type: object
                                                            properties:
                                                                max_reruns:
                                                                    type: integer
                                                                number:
