        post:
            operationId: post-webhooks
            tags:
                - Webhooks
            summary: Creates a webhook for the referenced project.
            description: |-
                url must be an HTTPS URL, and should_verify_tls and is_enabled default to true. events is one or more of workflow-completed (a workflow reached a terminal state) and job-completed (a job reached a terminal state). auto_disabled_at is set only by CircleCI. The signing secret is write-only: no response returns it, and has_signing_secret reports whether one is set. A project holds at most 25 webhooks; creating one more is a 400.

                Before creation, url must pass a connectivity test: the request sent by the ping endpoint must get a 2xx response within 10 seconds, so deploy the receiver first. A webhook created with is_enabled false is not tested.

                Not idempotent: webhooks have no natural key, so repeating a create adds another webhook and repeats the connectivity test.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                data:
                                    type: object
                                    properties:
                                        attributes:
                                            type: object
                                            properties:
                                                events:
                                                    type: array
                                                    items:
                                                        type: string
                                                is_enabled:
                                                    type: boolean
                                                    nullable: true
                                                name:
                                                    type: string
                                                scope:
                                                    type: string
                                                should_verify_tls:
                                                    type: boolean
                                                    nullable: true
                                                signing_secret:
                                                    type: string
                                                    nullable: true
                                                url:
                                                    type: string
                                            required:
                                                - events
                                                - name
                                                - scope
                                                - url
                                        references:
                                            type: object
                                            properties:
                                                project:
                                                    type: object
