    /api/v3/projects/{id}/rollback:
        post:
            operationId: post-projects-by-id-rollback
            tags:
                - Projects
            summary: Rolls a deployed component back to an earlier version.
            description: |-
                The component and the environment identify what is running the version being rolled back; current_version must match the version deployed there, so a caller working from stale state cannot roll back a version that has since been superseded.

                How the rollback runs depends on the project's deploy settings: a project with a rollback pipeline configured gets a pipeline run, and one without gets a restore-version command sent to the release agent deployed in that environment. data.id is that run or that command and rollback_type says which, since the two are polled in different places.

                The response is 200 rather than 202 because data.id is a handle to work in progress, not a resource newly created at a V3 address there would be a Location to point at.

                A component or environment the caller may not deploy to is reported as not found, as is a component and environment that do not describe one deployed thing in this project, so the response does not reveal whether the ids exist.

                EXPERIMENTAL — this endpoint is experimental and may change without notice. Field names and response shapes are not yet stable, and the deploy API as a whole is still under review. Do not depend on it in production clients.
            parameters:
                - name: id
                  in: path
                  required: true
                  description: The id.
                  schema:
                    type: string
                    format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                checkout_ref:
                                    type: string
                                component_id:
                                    type: string
                                    format: uuid
                                config_ref:
                                    type: string
                                current_version:
                                    type: string
                                environment_id:
                                    type: string
                                    format: uuid
                                namespace:
                                    type: string
                                parameters:
                                    type: object
                                    additionalProperties: {}
                                    nullable: true
                                reason:
                                    type: string
                                target_version:
                                    type: string
                            required:
                                - checkout_ref
                                - component_id
                                - config_ref
                                - current_version
                                - environment_id
                                - namespace
                                - reason
                                - target_version
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            attributes:
                                                type: object
                                                properties:
                                                    rollback_type:
                                                        type: string
                                                required:
                                                    - rollback_type
                                            id:
                                                type: string
                                                format: uuid
                                            references:
                                                type: object
                                                properties:
                                                    deploy_component:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                                format: uuid
                                                        required:
                                                            - id
                                                    deploy_environment:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                                format: uuid
                                                        required:
                                                            - id
                                                    project:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                                format: uuid
                                                        required:
                                                            - id
                                                required:
                                                    - deploy_component
                                                    - deploy_environment
                                                    - project
                                        required:
                                            - attributes
                                            - id
                                            - references
                                required:
                                    - data
                400:
                    description: The current version is not the version deployed there.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                404:
                    $ref: '#/components/responses/NotFound'
                409:
                    description: A command for that component instance is already being handled.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
