    /api/v3/context-restrictions:
        get:
            operationId: get-context-restrictions
            tags:
                - Context Restrictions
            summary: Lists every restriction applied to a context.
            description: |-
                The context_id filter is required. A context that does not exist, or that the caller is not entitled to see, returns 404.

                All three restriction types are listed together: project, expression and group. A project restriction carries a project reference and a group restriction carries a group reference, each with the subject's name where it can be resolved. An expression restriction has no subject reference — its match_pattern is the expression itself.

                created_at is absent on restrictions for which no creation timestamp is recorded.
            parameters:
                - name: filter[context_id]
                  in: query
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        created_at:
                                                            type: string
                                                            format: date-time
                                                            nullable: true
                                                        match_pattern:
                                                            type: string
                                                        name:
                                                            type: string
                                                            nullable: true
                                                        restriction_type:
                                                            type: string
                                                    required:
                                                        - match_pattern
                                                        - restriction_type
                                                id:
                                                    type: string
                                                    format: uuid
                                                references:
                                                    type: object
                                                    properties:
                                                        context:
                                                            type: object
                                                            properties:
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - id
                                                    required:
                                                        - context
                                            required:
                                                - attributes
                                                - id
                                                - references
                                required:
                                    - data
                400:
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
        post:
            operationId: post-context-restrictions
            tags:
                - Context Restrictions
            summary: Creates a restriction for the context referenced in the request body.
            description: |-
                restriction_type is "project", "expression" or "group". match_pattern is the project id, the expression, or the id of the group permitted to use the context respectively. To permit every member of the owning org, use a group restriction whose match_pattern is the org id.

                The created item carries the same subject reference the restriction list returns, with the subject id only; the list endpoint resolves subject names.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                data:
                                    type: object
                                    properties:
                                        attributes:
                                            type: object
                                            properties:
                                                match_pattern:
                                                    type: string
                                                restriction_type:
                                                    type: string
                                            required:
                                                - match_pattern
                                                - restriction_type
                                        references:
                                            type: object
                                            properties:
                                                context:
                                                    type: object
                                                    properties:
                                                        attributes:
                                                            type: string
                                                            nullable: true
                                                        id:
                                                            type: string
                                                            format: uuid
                                                        rel:
                                                            type: string
                                                            nullable: true
                                                    required:
                                                        - id
                                            required:
                                                - context
                                    required:
                                        - attributes
                                        - references
                            required:
                                - data
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            attributes:
                                                type: object
                                                properties:
                                                    created_at:
                                                        type: string
                                                        format: date-time
                                                        nullable: true
                                                    match_pattern:
                                                        type: string
                                                    name:
                                                        type: string
                                                        nullable: true
                                                    restriction_type:
                                                        type: string
                                                required:
                                                    - match_pattern
                                                    - restriction_type
                                            id:
                                                type: string
                                                format: uuid
                                            references:
                                                type: object
                                                properties:
                                                    context:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                                format: uuid
                                                        required:
                                                            - id
                                                required:
                                                    - context
                                        required:
                                            - attributes
                                            - id
                                            - references
                                required:
                                    - data
                400:
                    description: Invalid restriction type.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
