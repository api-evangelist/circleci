    /api/v3/orgs:
        get:
            operationId: get-orgs
            tags:
                - Orgs
            summary: Resolves orgs matching the given filters.
            description: filter[slug] is optional. With it, a single org is resolved by its slug; a slug matching no org is an empty collection rather than a 404. Without it, the orgs the calling user belongs to are listed.
            parameters:
                - name: filter[slug]
                  in: query
                  schema:
                    type: string
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped. The maximum is 50.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        avatar:
                                                            type: object
                                                            properties:
                                                                url:
                                                                    type: string
                                                            required:
                                                                - url
                                                        name:
                                                            type: string
                                                        vcs:
                                                            type: object
                                                            properties:
                                                                provider:
                                                                    type: string
                                                            required:
                                                                - provider
                                                            nullable: true
                                                    required:
                                                        - avatar
                                                        - name
                                                id:
                                                    type: string
                                                    format: uuid
                                            required:
                                                - attributes
                                                - id
                                    page:
                                        type: object
                                        properties:
                                            next:
                                                type: string
                                                nullable: true
                                            prev:
                                                type: string
                                                nullable: true
                                required:
                                    - data
                                    - page
                400:
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
