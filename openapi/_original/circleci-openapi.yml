    /api/v3/contexts:
        get:
            operationId: get-contexts
            tags:
                - Contexts
            summary: Lists the contexts owned by an organization.
            description: |-
                The org_id filter is required. The optional name filter matches case-insensitively on any part of the context name and is applied upstream, so it also narrows what pagination walks.

                include=restrictions embeds each context's group restrictions, with the group names, under the references key "context-restrictions" — the same shape the single-context read documents. That is what a caller rendering a list of contexts and who may use them needs, in one request.

                Project and expression restrictions are not embedded here. They are addressable only one context at a time, so including them across a page would cost a lookup per context. Read those from the context-restrictions endpoint, or from the single-context read, which embeds every type.
            parameters:
                - name: filter[name]
                  in: query
                  schema:
                    type: string
                - name: filter[org_id]
                  in: query
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: include
                  in: query
                  schema:
                    type: string
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        created_at:
                                                            type: string
                                                            format: date-time
                                                        name:
                                                            type: string
                                                    required:
                                                        - created_at
                                                        - name
                                                id:
                                                    type: string
                                                    format: uuid
                                            required:
                                                - attributes
                                                - id
                                    page:
                                        type: object
                                        properties:
                                            next:
                                                type: string
                                                nullable: true
                                            prev:
                                                type: string
                                                nullable: true
                                required:
                                    - data
                                    - page
                400:
                    description: Include accepts "restrictions" only.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
        post:
            operationId: post-contexts
            tags:
                - Contexts
            summary: Creates a context owned by an organization.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                data:
                                    type: object
                                    properties:
                                        attributes:
                                            type: object
                                            properties:
                                                name:
                                                    type: string
                                            required:
                                                - name
                                        references:
                                            type: object
                                            properties:
                                                org:
                                                    type: object
                                                    properties:
                                                        attributes:
                                                            type: string
                                                            nullable: true
                                                        id:
                                                            type: string
                                                            format: uuid
                                                        rel:
                                                            type: string
                                                            nullable: true
                                                    required:
                                                        - id
                                            required:
                                                - org
                                    required:
                                        - attributes
                                        - references
                            required:
                                - data
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            attributes:
                                                type: object
                                                properties:
                                                    created_at:
                                                        type: string
                                                        format: date-time
                                                    name:
                                                        type: string
                                                required:
                                                    - created_at
                                                    - name
                                            id:
