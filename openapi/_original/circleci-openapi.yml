    /api/v3/runs/facet-values:
        get:
            operationId: get-runs-facet-values
            tags:
                - Runs
            summary: Returns a paginated list of distinct values for a single run facet within one project.
            description: |-
                EXPERIMENTAL — This endpoint is experimental and may change without notice. Field names, request and response shapes, and pagination semantics are not yet stable. Do not depend on this endpoint in production clients.

                Values are ordered by most-recently-seen (the most recent pipeline that carried the value). Supported facet keys are actor.id, pipeline.status, pipeline.phase, pipeline.current_outcome, and indexed pipeline values (for example pipeline.git.branch).
            parameters:
                - name: filter[facet]
                  in: query
                  required: true
                  schema:
                    type: string
                - name: filter[project_id]
                  in: query
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped. The maximum is 200.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        count:
                                                            type: integer
                                                        value:
                                                            type: string
                                                    required:
                                                        - count
                                                        - value
                                            required:
                                                - attributes
                                    page:
                                        type: object
                                        properties:
                                            next:
                                                type: string
                                                nullable: true
                                            prev:
                                                type: string
                                                nullable: true
                                required:
                                    - data
                                    - page
                400:
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                404:
                    $ref: '#/components/responses/NotFound'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
