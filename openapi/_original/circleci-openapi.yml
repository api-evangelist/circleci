                                                        type: array
                                                        items:
                                                            type: object
                                                            properties:
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - id
                                                        nullable: true
                                                    org:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                                format: uuid
                                                        required:
                                                            - id
                                                        nullable: true
                                        required:
                                            - attributes
