    /api/v3/jobs/{id}/resource-usage:
        get:
            operationId: get-jobs-by-id-resource-usage
            tags:
                - Jobs
            summary: Returns a job's recorded resource usage per parallel execution.
            description: |-
                Each execution reports ordered CPU, memory and network samples taken interval_ms apart, alongside the resource class the job was dispatched to. Samples carry no timestamps: the first sample is the first collection tick after the execution started.

                Only Docker executions record samples, so machine and runner jobs return an empty parallel_executions list. Recordings expire after 90 days, and an execution that recorded nothing is absent from the list rather than empty, so a missing execution is not an execution that did not run.
            parameters:
                - name: id
                  in: path
                  required: true
                  description: The id.
                  schema:
                    type: string
                    format: uuid
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            attributes:
                                                type: object
                                                properties:
                                                    parallel_executions:
                                                        type: array
                                                        items:
                                                            type: object
                                                            properties:
                                                                cpu_cores:
                                                                    type: array
                                                                    items:
                                                                        type: number
                                                                execution:
                                                                    type: integer
                                                                interval_ms:
                                                                    type: integer
                                                                memory_bytes:
                                                                    type: array
                                                                    items:
                                                                        type: integer
                                                                network_rx_bytes:
                                                                    type: integer
                                                                network_tx_bytes:
                                                                    type: integer
                                                            required:
                                                                - cpu_cores
                                                                - execution
                                                                - interval_ms
                                                                - memory_bytes
                                                                - network_rx_bytes
                                                                - network_tx_bytes
                                                    resource_class:
                                                        type: object
                                                        properties:
                                                            cpu_count:
                                                                type: integer
                                                            memory_limit_bytes:
                                                                type: integer
                                                            name:
                                                                type: string
                                                        required:
                                                            - cpu_count
                                                            - memory_limit_bytes
                                                            - name
                                                        nullable: true
                                                required:
                                                    - parallel_executions
                                            id:
                                                type: string
                                                format: uuid
                                        required:
                                            - attributes
                                            - id
                                required:
                                    - data
                400:
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
