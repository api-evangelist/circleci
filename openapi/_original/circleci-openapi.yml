    /api/v3/notification/links:
        get:
            operationId: get-notification-links
            tags:
                - Notification Links
            summary: Lists the authenticated caller's external identity links.
            description: |-
                EXPERIMENTAL — This endpoint is experimental and may change without notice. Field names, request and response shapes, and pagination semantics are not yet stable. Do not depend on this endpoint in production clients.

                filter[user_id] is required ("me" or a user UUID). filter[connection_type] is optional (omitted lists all known connection types); filter[team_id] is optional and narrows results to a single external scope. The collection is paginated with page[limit] and page[cursor]; clients must follow page.next until it is absent.
            parameters:
                - name: filter[connection_type]
                  in: query
                  schema:
                    type: string
                - name: filter[team_id]
                  in: query
                  schema:
                    type: string
                - name: filter[user_id]
                  in: query
                  required: true
                  schema:
                    type: string
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        connection_type:
                                                            type: string
                                                        display_name:
                                                            type: string
                                                        external_id:
                                                            type: string
                                                        external_scope_id:
                                                            type: string
                                                    required:
                                                        - connection_type
                                                        - display_name
                                                        - external_id
                                                        - external_scope_id
                                                id:
                                                    type: string
                                                    format: uuid
                                                references:
                                                    type: object
                                                    properties:
                                                        user:
                                                            type: object
                                                            properties:
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - id
                                                    required:
                                                        - user
                                            required:
                                                - attributes
                                                - id
                                                - references
                                    page:
                                        type: object
                                        properties:
                                            next:
                                                type: string
                                                nullable: true
                                            prev:
                                                type: string
                                                nullable: true
                                required:
                                    - data
                                    - page
                400:
                    description: Filter[user_id] must be "me" or a user UUID
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
        delete:
            operationId: delete-notification-links
            tags:
                - Notification Links
            summary: Removes a single external identity link.
            description: |-
                EXPERIMENTAL — This endpoint is experimental and may change without notice. Field names and request shape are not yet stable. Do not depend on this endpoint in production clients.

                filter[user_id] ("me" or the caller's own UUID), filter[connection_type], and filter[team_id] are all required — together they form the CIAM link key. Idempotent: returns 204 whether or not a matching link exists. Another user's link is a 404.
            parameters:
                - name: filter[connection_type]
                  in: query
                  required: true
                  schema:
                    type: string
                - name: filter[team_id]
                  in: query
                  required: true
                  schema:
                    type: string
                - name: filter[user_id]
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                400:
                    description: Unsupported connection_type
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                404:
                    $ref: '#/components/responses/NotFound'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
