    /api/v3/projects:
        get:
            operationId: get-projects
            tags:
                - Projects
            summary: Resolves projects matching the given filters.
            description: |-
                At least one of filter[slug] (resolving a single project), filter[org_id] (listing an org's projects), or filter[following] (listing projects followed by the authenticated user) must be provided. If filter[slug] is provided then it must be the only filter. Both filter[org_id] and filter[following] can be used by themselves or together.

                filter[name] is optional and narrows the org's projects by a case-insensitive name search. It can be used with both filter[org_id] and filter[following] but combining it with filter[slug] is a 400.

                If filter[following] is provided, it may only be given the value "true". Anything else will result in a 400. Filtering for projects which are not followed is not supported.

                order_by chooses the order the projects come back in. It may be given "name", which orders them alphabetically, or "last_active_at", which orders them by how recently they last built. Any other value is a 400. An omitted order_by is "name". A single project resolved by filter[slug] has no order to it, so order_by is accepted and ignored there.

                An org that does not exist, or that the caller cannot see, is a 404. A slug that matches no project is an empty collection.

                The is_followed attribute reports whether the authenticated caller follows the project. It is returned however the projects were selected, so a listing that did not filter on filter[following] carries a mix of true and false.

                Notes on pagination:
            parameters:
                - name: filter[following]
                  in: query
                  schema:
                    type: string
                - name: filter[name]
                  in: query
                  schema:
                    type: string
                - name: filter[org_id]
                  in: query
                  schema:
                    type: string
                    format: uuid
                - name: filter[slug]
                  in: query
                  schema:
                    type: string
                - name: order_by
                  in: query
                  schema:
                    type: string
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped. The maximum is 50.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        is_followed:
                                                            type: boolean
                                                        name:
                                                            type: string
                                                    required:
                                                        - is_followed
                                                        - name
                                                id:
                                                    type: string
                                                    format: uuid
                                                references:
                                                    type: object
                                                    properties:
                                                        org:
                                                            type: object
                                                            properties:
                                                                attributes:
                                                                    type: object
                                                                    properties:
                                                                        name:
                                                                            type: string
                                                                    required:
                                                                        - name
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - attributes
                                                                - id
                                                    required:
                                                        - org
                                            required:
                                                - attributes
                                                - id
                                                - references
                                    page:
                                        type: object
                                        properties:
                                            next:
                                                type: string
                                                nullable: true
                                            prev:
                                                type: string
                                                nullable: true
                                required:
                                    - data
                                    - page
                400:
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
