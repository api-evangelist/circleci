    /api/v3/notification/channel-configs:
        get:
            operationId: get-notification-channel-configs
            tags:
                - Notification Channel Configs
            summary: Serves the V3 channel-config collection.
            description: |-
                The collection is paginated with page[limit] and page[cursor]; clients must follow page.next until it is absent. filter[scope] selects user or project scope.

                scope=user returns the caller's configs, narrowed to one org by the optional filter[org_id].

                scope=project requires filter[org_id]. With filter[project_id] it returns that project's configs; without it, it returns the configs of every project in the org.
            parameters:
                - name: filter[org_id]
                  in: query
                  schema:
                    type: string
                    format: uuid
                - name: filter[project_id]
                  in: query
                  schema:
                    type: string
                    format: uuid
                - name: filter[scope]
                  in: query
                  required: true
                  schema:
                    type: string
                - name: page[cursor]
                  in: query
                  description: Opaque cursor for the next or previous page. Send back the value of page.next or page.prev from a previous response on this operation, verbatim - it is a cursor value, not a URL, and must not be constructed or decoded. Omit for the first page.
                  schema:
                    type: string
                - name: page[limit]
                  in: query
                  description: Maximum items in one page. Out-of-range values are rejected with 400 rather than clamped.
                  schema:
                    type: integer
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                attributes:
                                                    type: object
                                                    properties:
                                                        channel_name:
                                                            type: string
                                                            nullable: true
                                                        channel_type:
                                                            type: string
                                                        disable_reason:
                                                            type: string
                                                            nullable: true
                                                        is_enabled:
                                                            type: boolean
                                                        target:
                                                            type: string
                                                            nullable: true
                                                    required:
                                                        - channel_type
                                                        - is_enabled
                                                id:
                                                    type: string
                                                    format: uuid
                                                references:
                                                    type: object
                                                    properties:
                                                        org:
                                                            type: object
                                                            properties:
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - id
                                                        project:
                                                            type: object
                                                            properties:
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - id
                                                        user:
                                                            type: object
                                                            properties:
                                                                id:
                                                                    type: string
                                                                    format: uuid
                                                            required:
                                                                - id
                                                    required:
                                                        - org
                                                        - project
                                                        - user
                                            required:
                                                - attributes
                                                - id
                                                - references
                                    page:
                                        type: object
                                        properties:
                                            next:
                                                type: string
                                                nullable: true
                                            prev:
                                                type: string
                                                nullable: true
                                required:
                                    - data
                                    - page
                400:
                    description: Filter[scope] must be "user" or "project"
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                404:
                    $ref: '#/components/responses/NotFound'
                429:
                    $ref: '#/components/responses/TooManyRequests'
                500:
                    $ref: '#/components/responses/InternalError'
